<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preset Alight Motion - Premium Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            /* Warna Statis & Konsisten - Kesan High-Tech */
            --neon-cyan: #00f2ff;
            --neon-violet: #7000ff;
            --glow-cyan: rgba(0, 242, 255, 0.15);
            --glow-violet: rgba(112, 0, 255, 0.2);
            
            --bg-base: #060913;
            --text-primary: #f8fafc;
            --text-secondary: #64748b;
            --glass-core: rgba(10, 15, 30, 0.7);
            --glass-stroke: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 110px;
            position: relative;
        }

        /* --- BACKGROUND AMBIENT NEBULA (CANGGIH & ELEGAN) --- */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
            animation: nebulaFloat 20s infinite alternate ease-in-out;
        }
        body::before {
            background: var(--neon-cyan);
            top: -10%;
            left: -10%;
        }
        body::after {
            background: var(--neon-violet);
            bottom: -10%;
            right: -10%;
            animation-delay: -10s;
        }

        @keyframes nebulaFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* --- SMOOTH PAGE SLIDE --- */
        .page-section {
            display: none;
            padding: 24px 20px;
            animation: ultraSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 500px;
            margin: 0 auto;
        }
        .page-section.active {
            display: block;
        }

        @keyframes ultraSlideUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* --- PREMIUM SHARP GLASS CARD --- */
        .glass-card {
            background: var(--glass-core);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-stroke);
            border-radius: 24px;
            padding: 28px 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .glass-card:hover {
            border-color: rgba(0, 242, 255, 0.2);
            box-shadow: 0 30px 60px -15px rgba(0, 242, 255, 0.1);
            transform: translateY(-2px);
        }

        /* --- MODERN HEADER --- */
        header {
            text-align: center;
            padding: 50px 20px 20px;
        }
        header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 40%, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- FUTURISTIC OUTLINE BUTTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            padding: 14px 24px;
            border: 1px solid var(--glass-stroke);
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
        }
        
        .btn-lightning-glow {
            border-color: rgba(0, 242, 255, 0.3);
            color: var(--neon-cyan);
        }
        .btn-lightning-glow:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--glow-cyan);
        }

        .btn-code-glow {
            border-color: rgba(112, 0, 255, 0.4);
            color: #b380ff;
        }
        .btn-code-glow:hover {
            background: var(--neon-violet);
            color: #fff;
            box-shadow: 0 0 20px var(--glow-violet);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        /* --- AUTO ASPECT RATIO MEDIA HOLDER --- */
        .preset-media-holder {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #020408;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .preset-img {
            width: 100%;
            height: auto;
            max-height: 450px; 
            object-fit: contain; 
        }

        .preset-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }

        .no-sound {
            color: #fda4af;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
            padding: 12px;
            background: rgba(244, 63, 94, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(244, 63, 94, 0.1);
            letter-spacing: 0.3px;
        }

        /* --- CYBERPUNK BOTTOM NAV DOCK --- */
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 86%;
            max-width: 300px;
            background: rgba(6, 9, 19, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 1000;
        }
        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 20px;
            border-radius: 14px;
        }
        .nav-item i {
            font-size: 18px;
        }
        .nav-item.active {
            color: var(--neon-cyan);
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.1);
        }

        /* --- WA FLOATING --- */
        .wa-float {
            position: fixed;
            bottom: 110px;
            right: 24px;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 999;
            transition: all 0.3s ease;
        }
        .wa-float:hover {
            background: #22c55e;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        /* --- LOADING SPINNER --- */
        .spinner {
            border: 3px solid rgba(255,255,255,0.03);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border-left-color: var(--neon-cyan);
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>Preset Studio</h1>
    </header>

    <a href="https://wa.me/628888171836" class="wa-float" target="_blank" aria-label="Contact Admin">
        <i class="ph-bold ph-whatsapp-logo"></i>
    </a>

    <section id="beranda" class="page-section active">
        <div class="glass-card" style="text-align: center; padding: 40px 24px;">
            <div style="background: rgba(0, 242, 255, 0.03); border: 1px solid rgba(0, 242, 255, 0.1); width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="ph-bold ph-sparkle" style="font-size: 28px; color: var(--neon-cyan);"></i>
            </div>
            <h2 style="font-weight: 700; font-size: 19px; margin-bottom: 12px; letter-spacing: -0.3px;">Creative Engine</h2>
            <p style="font-size: 13px; color: #94a3b8; line-height: 1.8; margin-bottom: 10px;">
                Eksplorasi kumpulan premium preset Alight Motion pilihan dengan sinematik terbaik. Tingkatkan kualitas editing videomu hanya dalam satu kali klik.
            </p>
        </div>
    </section>

    <section id="preset" class="page-section">
        <div id="loading-state" style="text-align: center; display: none;">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary); font-size: 13px; letter-spacing: 0.5px;">FETCHING ENGINE DATA...</p>
        </div>
        <div id="preset-container"></div>
    </section>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('beranda', this)">
            <i class="ph-bold ph-cube"></i>
            <span>Beranda</span>
        </div>
        <div class="nav-item" onclick="switchTab('preset', this)">
            <i class="ph-bold ph-film-strip"></i>
            <span>Preset</span>
        </div>
    </nav>

    <script>
        const SPREADSHEET_ID = '19ao1jySc0m7c6zNtA6VISopSoVOMivHRAJsrwTrf5eg';
        const SHEET_NAME = 'preset'; 

        function switchTab(tabId, el) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            el.classList.add('active');

            if(tabId === 'preset') fetchPresetsFromSheets();
            window.scrollTo(0,0);
        }

        async function fetchPresetsFromSheets() {
            const container = document.getElementById('preset-container');
            const loading = document.getElementById('loading-state');
            
            container.innerHTML = '';
            loading.style.display = 'block';

            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

            try {
                const response = await fetch(url);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                const rows = data.table.rows;
                loading.style.display = 'none';

                if (!rows || rows.length === 0) {
                    showEmptyState(container);
                    return;
                }

                rows.forEach((row) => {
                    const name = row.c[0] ? row.c[0].v : '';
                    const mediaUrl = row.c[1] ? row.c[1].v : '';
                    const link5mb = row.c[2] ? row.c[2].v : '';
                    const linkXml = row.c[3] ? row.c[3].v : '';
                    const audioUrl = row.c[4] ? row.c[4].v : '';

                    if(!name) return;

                    let card = document.createElement('div');
                    card.className = 'glass-card';
                    
                    let soundHtml = audioUrl 
                        ? `<a href="${audioUrl}" target="_blank" class="btn" style="border-color: rgba(34, 197, 94, 0.2); color: #4ade80; background: rgba(34, 197, 94, 0.02);"><i class="ph-bold ph-download-simple"></i> Download Musik</a>`
                        : `<div class="no-sound"><i class="ph-bold ph-speaker-slash"></i> Sound Tidak Tersedia</div>`;

                    let mediaHtml = '';
                    if(mediaUrl) {
                        if(mediaUrl.match(/\.(mp4|webm|ogg)/i) || mediaUrl.includes('video') || mediaUrl.includes('drive.google.com/file/d/')) {
                            mediaHtml = `<video src="${mediaUrl}" class="preset-img" controls playsinline></video>`;
                        } else {
                            mediaHtml = `<img src="${mediaUrl}" class="preset-img" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/600x337/0a0f1e/334155?text=Preview+Error'">`;
                        }
                    } else {
                        mediaHtml = `<img src="https://via.placeholder.com/600x337/0a0f1e/334155?text=No+Preview" class="preset-img">`;
                    }

                    card.innerHTML = `
                        <div class="preset-media-holder">${mediaHtml}</div>
                        <h3 class="preset-title">${name}</h3>
                        <div class="btn-group">
                            <a href="${link5mb}" class="btn btn-lightning-glow" target="_blank" style="flex: 1;"><i class="ph-bold ph-lightning"></i> 5MB</a>
                            <a href="${linkXml}" class="btn btn-code-glow" target="_blank" style="flex: 1;"><i class="ph-bold ph-code"></i> XML</a>
                        </div>
                        ${soundHtml}
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                loading.style.display = 'none';
                container.innerHTML = `
                <div class="glass-card" style="text-align:center; padding: 40px 20px; border-color: #f43f5e;">
                    <i class="ph-bold ph-warning-circle" style="font-size: 36px; color: #f43f5e; margin-bottom: 12px;"></i>
                    <p style="color: #f43f5e; font-size: 13px;">Gagal sinkronisasi data dengan Google Sheets.</p>
                </div>`;
            }
        }

        function showEmptyState(container) {
            container.innerHTML = `
            <div class="glass-card" style="text-align:center; padding: 40px 20px;">
                <i class="ph-bold ph-tray" style="font-size: 36px; color: var(--text-secondary); margin-bottom: 12px;"></i>
                <p style="color: var(--text-secondary); font-size: 13px;">Belum ada koleksi preset dirilis.</p>
            </div>`;
        }
    </script>
</body>
</html>
